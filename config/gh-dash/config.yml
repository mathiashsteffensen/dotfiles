# gh-dash merges this file over its built-in defaults.

pager:
  diff: delta

# Where PR checkout (and RepoPath in keybindings) finds local clones.
repoPaths:
  mathiashsteffensen/*: ~/code/*
  quantrading-dev/*: ~/code/*
  Driversnote-Dev/*: ~/code/*

keybindings:
  prs:
    - key: T
      name: review in tuicr
      command: tuicr pr https://github.com/{{.RepoName}}/pull/{{.PrNumber}}
    - key: E
      name: checks and logs in ENHANCE
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
